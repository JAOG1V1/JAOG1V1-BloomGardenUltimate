<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Bloom Garden Ultimate">
  <defs>
    <!-- Magical backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1f6a"/>
      <stop offset="0.55" stop-color="#5a2a8f"/>
      <stop offset="1" stop-color="#1a2050"/>
    </linearGradient>
    <!-- Petal gradient: pink -> lilac -->
    <radialGradient id="petal" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffd1ec"/>
      <stop offset="0.45" stop-color="#ff6fb6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </radialGradient>
    <!-- Glowing golden core -->
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </radialGradient>
    <!-- Leaf gradient -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef0b5"/>
      <stop offset="1" stop-color="#2fae7a"/>
    </linearGradient>
    <!-- Soft bloom glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8bd0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff8bd0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Rounded magical background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!-- Soft glow halo behind the bloom -->
  <circle cx="32" cy="33" r="24" fill="url(#glow)"/>

  <!-- Leaves -->
  <g fill="url(#leaf)">
    <path d="M28 50 C18 50 13 44 12 36 C22 36 27 41 28 50 Z"/>
    <path d="M36 50 C46 50 51 44 52 36 C42 36 37 41 36 50 Z"/>
  </g>
  <!-- Stem -->
  <path d="M31 50 L31 35 L33 35 L33 50 Z" fill="#2fae7a"/>

  <!-- Flower petals (8), radiating around the core -->
  <g filter="url(#soft)" transform="translate(32 28)">
    <g fill="url(#petal)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.6">
      <ellipse cx="0" cy="-15" rx="6.4" ry="11"/>
      <ellipse cx="0" cy="-15" rx="6.4" ry="11" transform="rotate(45)"/>
      <ellipse cx="0" cy="-15" rx="6.4" ry="11" transform="rotate(90)"/>
      <ellipse cx="0" cy="-15" rx="6.4" ry="11" transform="rotate(135)"/>
      <ellipse cx="0" cy="-15" rx="6.4" ry="11" transform="rotate(180)"/>
      <ellipse cx="0" cy="-15" rx="6.4" ry="11" transform="rotate(225)"/>
      <ellipse cx="0" cy="-15" rx="6.4" ry="11" transform="rotate(270)"/>
      <ellipse cx="0" cy="-15" rx="6.4" ry="11" transform="rotate(315)"/>
    </g>
    <!-- Glowing core -->
    <circle cx="0" cy="0" r="7.5" fill="url(#core)"/>
    <circle cx="0" cy="0" r="3.2" fill="#fff6cf" opacity="0.9"/>
  </g>

  <!-- Tiny magic sparkles -->
  <g fill="#fff6cf">
    <circle cx="49" cy="16" r="1.5"/>
    <circle cx="15" cy="20" r="1.1"/>
    <circle cx="46" cy="44" r="1"/>
  </g>
</svg>
